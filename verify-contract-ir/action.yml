name: Verify parity-approved Contract IR
description: Recompute Contract IR from the exact receipt and current TypeSpec/generated/authored input closure, then fail closed on any mismatch.
author: ORESoftware

branding:
  icon: shield
  color: purple

inputs:
  contract_ir:
    description: Existing parity-approved Contract IR produced by the validator action.
    required: true
  parity_receipt:
    description: Passed parity receipt consumed by the Contract IR.
    required: true
  typespec:
    description: Current independently authored TypeSpec entry file or project directory.
    required: true
  generated_schema:
    description: Current TypeSpec-generated comparison-only JSON Schema witness.
    required: true
  schema:
    description: Current independently authored JSON Schema Draft 2020-12 file or directory.
    required: true
  verification:
    description: Path for deterministic consumer-verification evidence.
    required: false
    default: .typespec-json-schema-validator/contract-ir-verification.json
  quiet:
    description: Suppress the verification JSON on standard output.
    required: false
    default: "false"

outputs:
  verification:
    description: Consumer-verification artifact path.
    value: ${{ inputs.verification }}

runs:
  using: composite
  steps:
    - name: Install the validator's lockfile-pinned toolchain
      shell: bash
      working-directory: ${{ github.action_path }}/..
      run: npm ci --omit=dev

    - name: Verify the exact Contract IR admission chain
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        TSJSV_CONTRACT_IR_INPUT: ${{ inputs.contract_ir }}
        TSJSV_PARITY_RECEIPT_INPUT: ${{ inputs.parity_receipt }}
        TSJSV_TYPESPEC_INPUT: ${{ inputs.typespec }}
        TSJSV_GENERATED_SCHEMA_INPUT: ${{ inputs.generated_schema }}
        TSJSV_SCHEMA_INPUT: ${{ inputs.schema }}
        TSJSV_VERIFICATION_INPUT: ${{ inputs.verification }}
        TSJSV_QUIET_INPUT: ${{ inputs.quiet }}
      run: |
        set -euo pipefail

        args=(
          verify-ir
          "--contract-ir=${TSJSV_CONTRACT_IR_INPUT}"
          "--parity-receipt=${TSJSV_PARITY_RECEIPT_INPUT}"
          "--typespec=${TSJSV_TYPESPEC_INPUT}"
          "--generated-schema=${TSJSV_GENERATED_SCHEMA_INPUT}"
          "--schema=${TSJSV_SCHEMA_INPUT}"
          "--verification=${TSJSV_VERIFICATION_INPUT}"
        )

        case "${TSJSV_QUIET_INPUT}" in
          true) args+=("--quiet") ;;
          false) ;;
          *)
            printf 'quiet must be true or false, got: %s\n' "${TSJSV_QUIET_INPUT}" >&2
            exit 3
            ;;
        esac

        node "${GITHUB_ACTION_PATH}/../bin/typespec-json-schema-validator.mjs" "${args[@]}"
