name: TypeSpec and JSON Schema peer-authority parity

on:
  pull_request:
    paths:
      - "schema-authority/**"
      - ".github/workflows/typespec-json-schema-peer-authority.yml"
  push:
    branches: [main, dev]
    paths:
      - "schema-authority/**"
      - ".github/workflows/typespec-json-schema-peer-authority.yml"
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-peer-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      # Replace both placeholders with the same reviewed immutable validator commit.
      - name: Generate Schema B and compare both peer authorities
        uses: ORESoftware/typespec-json-schema-validator@<40-character-commit>
        with:
          typespec: schema-authority/main.tsp
          schema: schema-authority/authored.schema.json
          report: .typespec-json-schema-validator/report.json
          contract_ir: .typespec-json-schema-validator/contract-ir.json
          output_dir: .typespec-json-schema-validator/generated
          max_probes: "64"

      - name: Require current evidence and canonical consumer-admission refusals
        uses: ORESoftware/typespec-json-schema-validator/actions/test-consumer-admission@<40-character-commit>
        with:
          contract_ir: .typespec-json-schema-validator/contract-ir.json
          report: .typespec-json-schema-validator/report.json
          typespec: schema-authority/main.tsp
          schema: schema-authority/authored.schema.json
          generated_schema: .typespec-json-schema-validator/generated/typespec.generated.schema.json

      - name: Verify authored authorities were not modified
        shell: bash
        run: git diff --exit-code -- schema-authority/

      # Diagnostic transport is intentionally weaker than semantic admission.
      - name: Retain diagnostic receipt, IR and comparison witness
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schema-peer-authority-${{ github.event.repository.name }}-${{ github.run_id }}
          path: .typespec-json-schema-validator/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
