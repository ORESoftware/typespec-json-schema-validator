name: Harden semantic mapping digest ordering
on:
  push:
    branches:
      - fix/run-id-bind-semantic-mapping
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/run-id-bind-semantic-mapping
      - name: Canonicalize mapping collection ordering
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          function replaceOnce(source, before, after, label) {
            const first = source.indexOf(before);
            if (first < 0) throw new Error(`missing target: ${label}`);
            if (source.indexOf(before, first + before.length) >= 0) throw new Error(`ambiguous target: ${label}`);
            return source.slice(0, first) + after + source.slice(first + before.length);
          }
          let run = readFileSync('src/run.mjs', 'utf8');
          run = replaceOnce(
            run,
            `export function semanticMappingDigest(mapping) {\n  return sha256(canonicalStringify({\n    schema: mapping.schema,\n    declarations: mapping.declarations,\n    ignore: mapping.ignore,\n  }));\n}\n`,
            `export function semanticMappingDigest(mapping) {\n  const declarations = [...mapping.declarations]\n    .map((entry) => ({ ...entry }))\n    .sort((left, right) => canonicalStringify(left).localeCompare(canonicalStringify(right)));\n  const ignore = Object.fromEntries(\n    ['typespec', 'generated', 'authored'].map((lane) => [lane, [...mapping.ignore[lane]].sort()]),\n  );\n  return sha256(canonicalStringify({ schema: mapping.schema, declarations, ignore }));\n}\n`,
            'semanticMappingDigest',
          );
          writeFileSync('src/run.mjs', run);

          let test = readFileSync('test/unit/run-id-host-path.test.mjs', 'utf8');
          test = replaceOnce(
            test,
            `  assert.equal(semanticMappingDigest(base), semanticMappingDigest(relocated));\n\n  const remapped = structuredClone(base);\n`,
            `  assert.equal(semanticMappingDigest(base), semanticMappingDigest(relocated));\n\n  const reorderedA = structuredClone(base);\n  reorderedA.declarations.push({ typespec: 'Example.Team', generated: 'Team', authored: 'Team' });\n  reorderedA.ignore = {\n    typespec: ['Example.LegacyB', 'Example.LegacyA'],\n    generated: ['GeneratedB', 'GeneratedA'],\n    authored: ['AuthoredB', 'AuthoredA'],\n  };\n  const reorderedB = structuredClone(reorderedA);\n  reorderedB.declarations.reverse();\n  reorderedB.ignore.typespec.reverse();\n  reorderedB.ignore.generated.reverse();\n  reorderedB.ignore.authored.reverse();\n  assert.equal(\n    semanticMappingDigest(reorderedA),\n    semanticMappingDigest(reorderedB),\n    'mapping collection order is not semantic identity',\n  );\n\n  const remapped = structuredClone(base);\n`,
            'mapping reorder regression',
          );
          writeFileSync('test/unit/run-id-host-path.test.mjs', test);
          NODE
          git diff --check
      - name: Install locked dependencies
        run: npm ci
      - name: Verify mapping and receipt identity regressions
        run: node --test test/unit/run-id-host-path.test.mjs test/unit/contract-ir.test.mjs
      - name: Commit hardened source
        run: |
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git add src/run.mjs test/unit/run-id-host-path.test.mjs
          git commit -m 'fix(receipts): canonicalize semantic mapping order'
          git push origin HEAD:fix/run-id-bind-semantic-mapping
