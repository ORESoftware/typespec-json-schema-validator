name: Apply semantic mapping identity fix
on:
  push:
    branches:
      - fix/run-id-bind-semantic-mapping
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/run-id-bind-semantic-mapping
          fetch-depth: 1
          persist-credentials: true
      - name: Apply exact source/test patch
        run: node scripts/apply-semantic-mapping-identity-fix.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit suite
        run: npm test
      - name: Run static checks
        run: npm run check
      - name: Commit verified fix and remove bootstrap machinery
        run: |
          set -euo pipefail
          rm scripts/apply-semantic-mapping-identity-fix.mjs
          rm .github/workflows/apply-semantic-mapping-identity-fix.yml
          git diff --check
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git add src/run.mjs test/unit/run-id-host-path.test.mjs \
            scripts/apply-semantic-mapping-identity-fix.mjs \
            .github/workflows/apply-semantic-mapping-identity-fix.yml
          git commit -m 'fix(receipts): bind semantic mapping into run identity'
          git push origin HEAD:fix/run-id-bind-semantic-mapping
