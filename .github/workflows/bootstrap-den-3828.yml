name: bootstrap-den-3828

on:
  push:
    branches:
      - feat/den-3828-typespec-json-schema-validator

permissions:
  contents: write

concurrency:
  group: bootstrap-den-3828
  cancel-in-progress: false

jobs:
  publish-source-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Materialize reviewed source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* | base64 --decode > /tmp/typespec-json-schema-validator.tar.gz
          echo 'fb86aa17bde9bd0b15e2d7f6597102a9848e7f22f6e72daace980b03e791482f  /tmp/typespec-json-schema-validator.tar.gz' | sha256sum --check
          tar -xzf /tmp/typespec-json-schema-validator.tar.gz -C .
          rm -rf .bootstrap .github/workflows/bootstrap-den-3828.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "feat(DEN-3828): add fail-closed TypeSpec JSON Schema parity validator"
          git push origin "HEAD:${GITHUB_REF_NAME}"
