name: Verify hardened mapping receipt identity
on:
  push:
    branches:
      - fix/run-id-bind-semantic-mapping
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/run-id-bind-semantic-mapping
          persist-credentials: false
      - name: Verify exact hardened source shape
        run: |
          set -euo pipefail
          ! grep -q 'localeCompare' src/run.mjs
          grep -q 'mapping collection order is not semantic identity' test/unit/run-id-host-path.test.mjs
          git diff --check
      - name: Install locked dependencies
        run: npm ci
      - name: Verify focused receipt identity regressions
        run: node --test test/unit/run-id-host-path.test.mjs test/unit/contract-ir.test.mjs
      - name: Run full unit suite and static checks
        run: |
          npm test
          npm run check
