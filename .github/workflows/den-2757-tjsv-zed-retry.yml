name: DEN-2757 tjsv Zed package retry

on:
  push:
    branches: [DEN-2757-tjsv-zed-package]
    paths:
      - '.github/workflows/den-2757-tjsv-zed-retry.yml'

permissions:
  contents: write

concurrency:
  group: den-2757-tjsv-zed-retry
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: DEN-2757-tjsv-zed-package
          persist-credentials: true
          show-progress: false

      - name: Generate reviewed tjsv package changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/den-2757-tjsv-zed-bootstrap.yml').read_text()
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n"
          if start not in workflow:
              raise SystemExit('embedded package patch start marker not found')
          script = workflow.split(start, 1)[1].split(end, 1)[0]
          exec(compile(dedent(script), '<tjsv-zed-package-patch>', 'exec'), {})

          manifest = Path('.zpkg.toml')
          text = manifest.read_text()
          text = text.replace(
              'command = "npm ci --ignore-scripts && node ',
              'command = "npm ci --ignore-scripts && npm rebuild @oresoftware/f2e --foreground-scripts && node ',
          )
          manifest.write_text(text)
          PY

      - name: Install without ambient scripts, then explicitly build flags-2-env
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm rebuild @oresoftware/f2e --foreground-scripts
          npm run check
          npm run flags:audit
          npm test
          node ./bin/typespec-json-schema-validator.mjs doctor --quiet

      - name: Commit tested package contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json README.md .zpkg.toml .zpkg.lock test/unit/package-contract.test.mjs
          if git diff --cached --quiet; then
            echo 'No package changes remain.'
            exit 0
          fi
          git diff --cached --stat
          git commit -m 'feat(DEN-2757): publish tjsv as a Zed CLI package'
          git push origin HEAD:refs/heads/DEN-2757-tjsv-zed-package
