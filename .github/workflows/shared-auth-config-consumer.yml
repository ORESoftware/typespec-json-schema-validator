name: Shared Auth config consumer

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-auth-config-consumer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SHARED_AUTH_REF: 7c4f6ec1ceb81e12c7bcb31263a7e1d6020120a9
  CONSUMER_DIR: ${{ github.workspace }}/tjsv/test/fixtures/external/shared-auth-config/consumer

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact TJSV head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: tjsv
          persist-credentials: false

      - name: Verify exact TJSV head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git -C tjsv rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify vendored Shared Auth source identity
        working-directory: tjsv
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-external-shared-auth-snapshot.mjs
          test "$(node -p "require('./test/fixtures/external/shared-auth-config/source-manifest.json').sourceRevision")" = "$SHARED_AUTH_REF"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: tjsv/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.23.2'
          cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0

      - name: Install pinned TJSV closure
        working-directory: tjsv
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node ./bin/typespec-json-schema-validator.mjs doctor

      - name: Install isolated TypeScript evidence compiler
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/shared-auth-ts-toolchain"
          npm install --prefix "$prefix" --no-save --package-lock=false typescript@7.0.2
          "$prefix/node_modules/.bin/tsc" --version

      - name: Run TJSV peer-authority parity and emit Contract IR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shared-auth-tjsv/generated"
          node tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec="$CONSUMER_DIR/contracts/shared-auth-config/main.tsp" \
            --schema="$CONSUMER_DIR/schema/shared-auth-config.schema.json" \
            --instances="$CONSUMER_DIR/contracts/shared-auth-config/instances" \
            --output-dir="$RUNNER_TEMP/shared-auth-tjsv/generated" \
            --bundle-id=shared-auth-config.generated.schema.json \
            --report="$RUNNER_TEMP/shared-auth-tjsv/parity-report.json" \
            --contract-ir="$RUNNER_TEMP/shared-auth-tjsv/contract-ir.json"

      - name: Run locked Rust runtime boundary adapter
        shell: bash
        run: cargo test --locked --manifest-path "$CONSUMER_DIR/contracts/shared-auth-config/runtime/rust/Cargo.toml"

      - name: Run Go runtime boundary adapter
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONSUMER_DIR/contracts/shared-auth-config/runtime/go"
          go test ./...

      - name: Compile and run TypeScript runtime boundary adapter
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/shared-auth-config-ts"
          tsc="$RUNNER_TEMP/shared-auth-ts-toolchain/node_modules/.bin/tsc"
          mkdir -p "$out"
          "$tsc" \
            "$CONSUMER_DIR/contracts/shared-auth-config/runtime/typescript/shared-auth-config.ts" \
            --target ES2022 \
            --module ES2022 \
            --moduleResolution Bundler \
            --strict \
            --outDir "$out"
          printf '{"type":"module"}\n' > "$out/package.json"
          TS_ADAPTER_MODULE="$out/shared-auth-config.js" \
            node "$CONSUMER_DIR/contracts/shared-auth-config/runtime/typescript/test.mjs"

      - name: Expose exact TJSV package to the vendored ESM verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CONSUMER_DIR/node_modules/@oresoftware"
          ln -s "$GITHUB_WORKSPACE/tjsv" \
            "$CONSUMER_DIR/node_modules/@oresoftware/typespec-json-schema-validator"
          test -f "$CONSUMER_DIR/node_modules/@oresoftware/typespec-json-schema-validator/package.json"

      - name: Verify current-input language/runtime admission
        shell: bash
        env:
          SOURCE_REVISION: ${{ env.SHARED_AUTH_REF }}
          TJSV_REPORT: ${{ runner.temp }}/shared-auth-tjsv/parity-report.json
          TJSV_CONTRACT_IR: ${{ runner.temp }}/shared-auth-tjsv/contract-ir.json
          TJSV_GENERATED_SCHEMA: ${{ runner.temp }}/shared-auth-tjsv/generated/shared-auth-config.generated.schema.json
          BOUNDARY_EVIDENCE_DIR: ${{ runner.temp }}/shared-auth-tjsv/language-boundary-evidence
          BOUNDARY_VERIFICATION: ${{ runner.temp }}/shared-auth-tjsv/language-boundary-verification.json
        run: |
          set -euo pipefail
          cd "$CONSUMER_DIR"
          node contracts/shared-auth-config/runtime/verify-language-boundaries.mjs

      - name: Require complete admission evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/shared-auth-tjsv/parity-report.json"
          test -f "$RUNNER_TEMP/shared-auth-tjsv/contract-ir.json"
          test -f "$RUNNER_TEMP/shared-auth-tjsv/generated/shared-auth-config.generated.schema.json"
          test -f "$RUNNER_TEMP/shared-auth-tjsv/language-boundary-evidence/rust.json"
          test -f "$RUNNER_TEMP/shared-auth-tjsv/language-boundary-evidence/typescript.json"
          test -f "$RUNNER_TEMP/shared-auth-tjsv/language-boundary-evidence/go.json"
          test -f "$RUNNER_TEMP/shared-auth-tjsv/language-boundary-verification.json"

      - name: Retain exact-head Shared Auth admission evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-auth-config-consumer-evidence
          path: |
            ${{ runner.temp }}/shared-auth-tjsv/parity-report.json
            ${{ runner.temp }}/shared-auth-tjsv/contract-ir.json
            ${{ runner.temp }}/shared-auth-tjsv/generated/shared-auth-config.generated.schema.json
            ${{ runner.temp }}/shared-auth-tjsv/language-boundary-evidence/*.json
            ${{ runner.temp }}/shared-auth-tjsv/language-boundary-verification.json
          if-no-files-found: warn
          retention-days: 30
