name: Centralize Contract IR receipt projection
on:
  push:
    branches:
      - fix/contract-ir-host-independent-receipts
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/contract-ir-host-independent-receipts
      - name: Reuse canonical run identity projections
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          function replaceOnce(source, before, after, label) {
            const first = source.indexOf(before);
            if (first < 0) throw new Error(`missing target: ${label}`);
            if (source.indexOf(before, first + before.length) >= 0) throw new Error(`ambiguous target: ${label}`);
            return source.slice(0, first) + after + source.slice(first + before.length);
          }
          const path = 'src/contract-ir.mjs';
          let source = readFileSync(path, 'utf8');
          source = replaceOnce(
            source,
            "import { crossValidate } from './differential.mjs';\n",
            "import { crossValidate } from './differential.mjs';\nimport { runIdentityConfiguration, runIdentityToolchain } from './run.mjs';\n",
            'run identity import',
          );
          const helpers = `function semanticConfiguration(configuration) {\n  if (!isObject(configuration)) return configuration ?? null;\n  const projected = structuredClone(configuration);\n  if (isObject(projected.emitterOptions)) {\n    delete projected.emitterOptions['emitter-output-dir'];\n  }\n  projected.executionMode = null;\n  if (isObject(projected.differential)) {\n    projected.differential.instanceCorpus = null;\n  }\n  return projected;\n}\n\nfunction semanticToolchain(toolchain) {\n  if (!isObject(toolchain)) return toolchain ?? null;\n  return {\n    ...structuredClone(toolchain),\n    typespecCompiler: {\n      version: toolchain.typespecCompiler?.version ?? null,\n    },\n  };\n}\n\n`;
          source = replaceOnce(source, helpers, '', 'duplicated projection helpers');
          source = source.replaceAll('semanticConfiguration(projected.configuration)', 'runIdentityConfiguration(projected.configuration)');
          source = source.replaceAll('semanticToolchain(projected.toolchain)', 'runIdentityToolchain(projected.toolchain)');
          source = source.replaceAll('semanticToolchain(report.toolchain)', 'runIdentityToolchain(report.toolchain)');
          source = source.replaceAll('semanticConfiguration(report.configuration)', 'runIdentityConfiguration(report.configuration)');
          if (source.includes('semanticConfiguration(') || source.includes('semanticToolchain(')) {
            throw new Error('private projection helper reference remained');
          }
          writeFileSync(path, source);
          NODE
          git diff --check
      - name: Install locked dependencies
        run: npm ci
      - name: Verify Contract IR and run identity regressions
        run: node --test test/unit/contract-ir.test.mjs test/unit/run-id-host-path.test.mjs
      - name: Run full unit suite and static checks
        run: |
          npm test
          npm run check
      - name: Commit centralized projection
        run: |
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git add src/contract-ir.mjs
          git commit -m 'refactor(receipts): reuse canonical run identity projection'
          git push origin HEAD:fix/contract-ir-host-independent-receipts
