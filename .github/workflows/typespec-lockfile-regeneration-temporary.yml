name: One-time TypeSpec lockfile regeneration (review branch only)
on:
  push:
    branches:
      - security/typespec-1-17-admission-20261018
permissions:
  contents: write
concurrency:
  group: typespec-1-17-locked-regeneration
  cancel-in-progress: false
jobs:
  refresh-lockfile:
    if: ${{ github.repository == 'ORESoftware/typespec-json-schema-validator' && github.ref == 'refs/heads/security/typespec-1-17-admission-20261018' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
      - name: Recreate authentic registry-integrity-pinned lockfile without scripts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const pkg=JSON.parse(readFileSync('package.json'));
          const lock=JSON.parse(readFileSync('package-lock.json'));
          if (pkg.version !== lock.version || pkg.version !== lock.packages[''].version) throw Error('package/lockfile version drift');
          for (const dep of ['@typespec/compiler','@typespec/json-schema']) {
            if (pkg.dependencies[dep] !== '1.17.0' || lock.packages[''].dependencies[dep] !== '1.17.0') throw Error('unmatched ' + dep + ' root pin');
            const entry=lock.packages['node_modules/'+dep];
            if (entry?.version !== '1.17.0' || typeof entry.integrity !== 'string' || !entry.integrity.startsWith('sha512-')) throw Error('unverified locked dependency: ' + dep);
          }
          JS
      - name: Commit lockfile only if branch head still matches trusted source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already regenerated; no mutation required"
            exit 0
          fi
          remote_sha="$(gh api 'repos/ORESoftware/typespec-json-schema-validator/git/ref/heads/security/typespec-1-17-admission-20261018' --jq '.object.sha')"
          test "$remote_sha" = "$GITHUB_SHA"
          node --input-type=module - <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const content=readFileSync('package-lock.json').toString('base64');
          const sha=execFileSync('git',['rev-parse','HEAD:package-lock.json'],{encoding:'utf8'}).trim();
          writeFileSync('/tmp/tjsv-lockfile-update.json', JSON.stringify({
            message: 'security: regenerate npm lockfile for patched TypeSpec 1.17.0',
            branch: 'security/typespec-1-17-admission-20261018',
            content,
            sha
          }));
          JS
          gh api -X PUT 'repos/ORESoftware/typespec-json-schema-validator/contents/package-lock.json' --input /tmp/tjsv-lockfile-update.json --silent
