name: LLVM typed actor compact32 exact-blob AOT
on:
  push:
    branches:
      - ci/ores-actor-compressed32-mir-20261020
permissions:
  contents: read
jobs:
  llvm-backend-aot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Verify all original source blob identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ores-compressed-ci/src/main/cpp/oreslang/runtime/ActorArena.c)" = "b88a7c81eb81ae9bc370629f2220357ea82dc498"
          test "$(git hash-object ores-compressed-ci/src/main/cpp/oreslang/runtime/ActorArena.h)" = "3ad557042f0351a3e6dd0b36e4e6e649f237edcf"
          test "$(git hash-object ores-compressed-ci/src/main/cpp/oreslang/backend/ManagedRefMir.hpp)" = "9fd569063450c36931379871d1d5c9129cccca75"
          test "$(git hash-object ores-compressed-ci/src/main/cpp/oreslang/backend/ManagedRefMirLowering.hpp)" = "3bf66e185328bc5765252a0ef3f156fc28f2da96"
          test "$(git hash-object ores-compressed-ci/tests/managed_ref_mir_llvm_test.cpp)" = "e483b55f240192a07ed717f3f1a68fc8621e4acd"
          test "$(git hash-object ores-compressed-ci/tests/native_actor_compressed32_llvm_driver.c)" = "da10259c25360b13419f6dbec84954c7da8aa15d"
          test "$(git hash-object ores-compressed-ci/tests/native_actor_compressed32_llvm_aot.py)" = "305ac32675c07b13e2b63b9fd650571d1149f373"
      - name: Ensure LLVM native toolchain available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v llvm-config >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq llvm-dev clang
          fi
          llvm-config --version
          clang --version | head -1
      - name: Build LLVM IR producer and run real native actor AOT
        shell: bash
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          read -r -a LLVM_CFLAGS <<< "$(llvm-config --cxxflags)"
          read -r -a LLVM_LIBS <<< "$(llvm-config --ldflags --system-libs --libs core support | tr '\n' ' ')"
          "$CXX" "${LLVM_CFLAGS[@]}" -std=c++17 -fexceptions \
            -Wall -Wextra -Wpedantic -Werror -Wno-unused-parameter \
            -DORESLANG_COMPRESSED32_TEST_PROVENANCE=1 \
            -Iores-compressed-ci/src/main/cpp \
            ores-compressed-ci/tests/managed_ref_mir_llvm_test.cpp \
            "${LLVM_LIBS[@]}" -o /tmp/ores-managed-ref-mir-llvm-test
          /tmp/ores-managed-ref-mir-llvm-test
          python3 ores-compressed-ci/tests/native_actor_compressed32_llvm_aot.py \
            --producer /tmp/ores-managed-ref-mir-llvm-test \
            --clang "$(command -v clang)" \
            --root ores-compressed-ci
