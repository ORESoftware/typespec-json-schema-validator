name: Oreslang compressed32 MIR exact-blob host tests
on:
  push:
    branches:
      - ci/ores-actor-compressed32-mir-20261020
permissions:
  contents: read
jobs:
  actor-reference-mir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        sanitizer: [none, asan-ubsan]
    steps:
      - uses: actions/checkout@v4
      - name: Verify byte-for-byte private compiler source provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ores-compressed-ci/src/main/cpp/oreslang/runtime/ActorArena.h)" = "3ad557042f0351a3e6dd0b36e4e6e649f237edcf"
          test "$(git hash-object ores-compressed-ci/src/main/cpp/oreslang/runtime/ActorArena.c)" = "b88a7c81eb81ae9bc370629f2220357ea82dc498"
          test "$(git hash-object ores-compressed-ci/tests/native_actor_compact_arena_test.cpp)" = "1c64f37839f3af076736b3212be42e9f4d839fe3"
          test "$(git hash-object ores-compressed-ci/src/main/cpp/oreslang/backend/ManagedRefMir.hpp)" = "dd7466221804ded1c3560902baf449d8910db43c"
          test "$(git hash-object ores-compressed-ci/tests/managed_ref_mir_test.cpp)" = "e46ac3b37158424db2b5d858d40b16dbd31989c6"
      - name: Build and run actual actor C slab and typed MIR admission tests
        shell: bash
        env:
          COMPILER: ${{ matrix.compiler }}
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          set -euo pipefail
          case "$COMPILER" in
            gcc) CC=gcc; CXX=g++ ;;
            clang) CC=clang; CXX=clang++ ;;
          esac
          opts=(-O2 -Wall -Wextra -Wpedantic -Werror)
          if [ "$SANITIZER" = asan-ubsan ]; then
            opts=(-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -Wall -Wextra -Wpedantic -Werror)
          fi
          "$CC" -std=c11 "${opts[@]}" -DORESLANG_NATIVE_TEST_DOMAIN_EXHAUSTION=1 \
            -Iores-compressed-ci/src/main/cpp \
            -c ores-compressed-ci/src/main/cpp/oreslang/runtime/ActorArena.c \
            -o /tmp/actorarena.o
          "$CXX" -std=c++17 -pthread "${opts[@]}" \
            -DORESLANG_NATIVE_TEST_DOMAIN_EXHAUSTION=1 \
            -Iores-compressed-ci/src/main/cpp \
            ores-compressed-ci/tests/native_actor_compact_arena_test.cpp \
            /tmp/actorarena.o -o /tmp/actorarena-contract
          /tmp/actorarena-contract
          "$CXX" -std=c++17 "${opts[@]}" \
            -Iores-compressed-ci/src/main/cpp \
            ores-compressed-ci/tests/managed_ref_mir_test.cpp \
            -o /tmp/typed-mir-contract
          /tmp/typed-mir-contract
