name: temporary projection regression probe

on:
  pull_request:
    paths:
      - 'src/contract-ir.mjs'
      - 'src/projection-admission/**'
      - 'test/integration/contract-ir-cli.test.mjs'
      - 'test/integration/projection-current-files.test.mjs'
      - 'test/integration/projection-verification-cli.test.mjs'
      - '.github/workflows/projection-regression-probe.yml'

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          show-progress: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install exact dependency graph
        run: npm ci
      - name: Run receipt and projection regressions
        run: |
          node --test \
            test/integration/contract-ir-cli.test.mjs \
            test/integration/projection-current-files.test.mjs \
            test/integration/projection-verification-cli.test.mjs
