name: Oreslang PR785 verified full-source LLVM / CTest
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Require exact private-source Git tree before running any compiler
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/verify-ores-pr785-fulltree.py
      - name: Install native LLVM toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cmake ninja-build clang llvm-dev
          llvm-config --version
      - name: Configure exact source, no cross-organization checkout
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          cmake -S ores-source-fulltree -B "${RUNNER_TEMP}/ores-cmake" -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
      - name: Build entire source tree
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "${RUNNER_TEMP}/ores-cmake" --parallel 2
      - name: Execute all CTest cases
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir "${RUNNER_TEMP}/ores-cmake" --output-on-failure --no-tests=error --timeout 180
