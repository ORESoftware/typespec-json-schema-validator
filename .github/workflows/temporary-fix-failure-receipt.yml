name: temporary failure receipt repair

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-fix-failure-receipt.yml'
      - 'src/contract-ir.mjs'

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ci/zed-release-0.1.0-20260920'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          show-progress: false

      - name: Patch only failure-receipt semantic normalization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/contract-ir.mjs')
          text = path.read_text()
          old = '''export function semanticReportProjection(report) {
            const projected = structuredClone(report);
            projected.configuration = runIdentityConfiguration(projected.configuration);
            projected.toolchain = runIdentityToolchain(projected.toolchain);
          '''
          new = '''export function semanticReportProjection(report) {
            const projected = structuredClone(report);
            if (isObject(projected.configuration)) {
              projected.configuration = runIdentityConfiguration(projected.configuration);
            }
            if (isObject(projected.toolchain)) {
              projected.toolchain = runIdentityToolchain(projected.toolchain);
            }
          '''
          if new in text:
              print('repair already present')
          elif old in text:
              path.write_text(text.replace(old, new, 1))
          else:
              raise SystemExit('expected semanticReportProjection block not found; refusing broad edit')
          PY
          git diff --check
          git diff -- src/contract-ir.mjs

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Prove Contract IR and projection regressions
        run: |
          npm ci
          node --test \
            test/integration/contract-ir-cli.test.mjs \
            test/integration/projection-current-files.test.mjs \
            test/integration/projection-verification-cli.test.mjs

      - name: Commit exact repair when needed
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- src/contract-ir.mjs; then
            echo 'no repair commit needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/contract-ir.mjs
          git commit -m 'fix: make failure receipt projection total'
          git push origin "HEAD:${HEAD_BRANCH}"
