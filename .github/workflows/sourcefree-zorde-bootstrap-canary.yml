name: Independent source-free Bash startup security canary
on:
  push:
    branches:
      - ci/sourcefree-zorde-bootstrap-isolation-20261019
    paths:
      - .github/workflows/sourcefree-zorde-bootstrap-canary.yml
      - tests/source_free/test_sourcefree_bootstrap_startup_canary.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-startup-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout only this PUBLIC synthetic test repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run synthetic Bash startup and symlink-admission matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S tests/source_free/test_sourcefree_bootstrap_startup_canary.py
          echo 'SOURCE_FREE_ONLY_NO_PRIVATE_ORESLANG_SOURCE'
