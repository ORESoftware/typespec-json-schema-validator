name: one-shot DEN-3828 array cardinality probes

on:
  push:
    branches:
      - fix/DEN-3828-array-cardinality-probes-20260911
    paths:
      - '.github/workflows/repair-DEN-3828-array-cardinality-probes.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Install Node 22.16.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.16.0'
          package-manager-cache: false

      - name: Add bounded array cardinality mutants and regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/witness.mjs')
          text = path.read_text()
          needle = '''  for (const node of nodes) {\n    for (const substitution of SCALAR_SUBSTITUTIONS) {\n'''
          replacement = '''  // Arrays need explicit length-boundary probes. Scalar substitution can replace an\n  // entire array, but it cannot expose a generated tuple that silently accepts one item too few\n  // or too many compared with an independently authored minItems/maxItems authority.\n  for (const node of nodes) {\n    if (!Array.isArray(node.value)) {\n      continue;\n    }\n    if (node.value.length > 0) {\n      const shortened = node.value.slice(0, -1).map(deepClone);\n      push('shorten-array', node.pointer, setAtPointer(seed, node.pointer, shortened));\n    }\n    const extended = node.value.map(deepClone);\n    extended.push(OUT_OF_DOMAIN_STRING);\n    push('extend-array', node.pointer, setAtPointer(seed, node.pointer, extended));\n  }\n\n  for (const node of nodes) {\n    for (const substitution of SCALAR_SUBSTITUTIONS) {\n'''
          assert text.count(needle) == 1, 'expected one scalar-substitution loop insertion point'
          path.write_text(text.replace(needle, replacement, 1))
          PY

          cat > test/unit/differential-array-cardinality.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { mkdtemp, writeFile } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import test from 'node:test';
          import { canonicalStringify } from '../../src/canonical.mjs';
          import { crossValidate } from '../../src/differential.mjs';
          import { loadSchemaCollection } from '../../src/json-schema.mjs';

          const DIALECT = 'https://json-schema.org/draft/2020-12/schema';

          function tupleSchema({ bounded }) {
            const tuple = {
              type: 'array',
              prefixItems: [
                { type: 'string', const: '/api/docs' },
                { type: 'string', const: '/api-docs' },
                { type: 'string', const: '/api-docs/' },
                { type: 'string', const: '/api-docs.json' },
              ],
            };
            if (bounded) {
              tuple.minItems = 4;
              tuple.maxItems = 4;
            }
            return {
              $schema: DIALECT,
              $defs: { RouteAliases: tuple },
            };
          }

          test('differential probing witnesses tuple cardinality drift', async () => {
            const root = await mkdtemp(join(tmpdir(), 'tsjsv-array-cardinality-'));
            const generatedPath = join(root, 'generated.schema.json');
            const authoredPath = join(root, 'authored.schema.json');
            await writeFile(generatedPath, `${JSON.stringify(tupleSchema({ bounded: false }), null, 2)}\n`);
            await writeFile(authoredPath, `${JSON.stringify(tupleSchema({ bounded: true }), null, 2)}\n`);

            const [generatedCollection, authoredCollection] = await Promise.all([
              loadSchemaCollection(generatedPath, { requireDialect: true }),
              loadSchemaCollection(authoredPath, { requireDialect: true }),
            ]);
            const result = crossValidate({
              generatedCollection,
              authoredCollection,
              declarationMap: [{
                typespec: 'Example.RouteAliases',
                generated: 'RouteAliases',
                authored: 'RouteAliases',
              }],
              maxProbes: 64,
            });

            assert.ok(result.summary.divergences > 0, canonicalStringify(result));
            const divergences = result.findings.filter(
              (finding) => finding.ruleId === 'instance-verdict-divergence',
            );
            assert.ok(divergences.length > 0, canonicalStringify(result.findings));
            assert.ok(
              divergences.some((finding) =>
                Array.isArray(finding.witness?.instance)
                && [3, 5].includes(finding.witness.instance.length)),
              `expected a length-3 or length-5 tuple witness, got ${canonicalStringify(divergences)}`,
            );
            for (const finding of divergences) {
              assert.notEqual(finding.left.valid, finding.right.valid);
            }
          });
          EOF

          git diff --check -- src/witness.mjs test/unit/differential-array-cardinality.test.mjs

      - name: Run focused and full validator tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild @oresoftware/f2e --foreground-scripts
          node --test ./test/unit/differential-array-cardinality.test.mjs
          npm run check
          npm test

      - name: Remove one-shot repair lane and push reviewed result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          rm .github/workflows/repair-DEN-3828-array-cardinality-probes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/witness.mjs test/unit/differential-array-cardinality.test.mjs .github/workflows/repair-DEN-3828-array-cardinality-probes.yml
          git diff --cached --check
          git commit -m 'fix(DEN-3828): probe array cardinality in differential lane'
          git -c credential.helper='!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f' \
            push https://github.com/ORESoftware/typespec-json-schema-validator.git \
            HEAD:fix/DEN-3828-array-cardinality-probes-20260911
