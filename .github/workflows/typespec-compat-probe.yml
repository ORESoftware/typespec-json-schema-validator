name: temporary TypeSpec compatibility probe

on:
  pull_request:
    paths:
      - '.github/workflows/typespec-compat-probe.yml'

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        typespec: ['1.15.0', '1.16.0']
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          show-progress: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
      - name: Install committed graph
        run: npm ci
      - name: Substitute one coherent TypeSpec release
        shell: bash
        env:
          TYPESPEC_VERSION: ${{ matrix.typespec }}
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false \
            "@typespec/compiler@${TYPESPEC_VERSION}" \
            "@typespec/json-schema@${TYPESPEC_VERSION}"
          node -e '
            const fs=require("node:fs");
            for (const p of ["@typespec/compiler","@typespec/json-schema"]) {
              const metadata=JSON.parse(fs.readFileSync(`node_modules/${p}/package.json`, "utf8"));
              const v=metadata.version;
              if(v!==process.env.TYPESPEC_VERSION) throw new Error(`${p}=${v}`);
              console.log(`${p}@${v}`);
            }
          '
      - name: Run compiler-backed integration only
        run: npm run test:integration
