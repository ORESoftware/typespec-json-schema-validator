name: one-shot DEN-3828 pattern witness baseline

on:
  push:
    branches:
      - fix/DEN-3828-array-cardinality-probes-20260911
    paths:
      - '.github/workflows/repair-DEN-3828-pattern-witness-baseline.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Install Node 22.16.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.16.0'
          package-manager-cache: false

      - name: Make common anchored patterns synthesize valid baselines
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/witness.mjs')
          text = path.read_text()
          old = '''function buildString(schema) {\n  const minLength = typeof schema.minLength === 'number' ? schema.minLength : 0;\n  const maxLength = typeof schema.maxLength === 'number' ? schema.maxLength : Number.POSITIVE_INFINITY;\n  const seed = 'tsjsv';\n  let value = seed.length >= minLength ? seed : seed.padEnd(minLength, 'x');\n  if (value.length > maxLength) {\n    value = value.slice(0, Math.max(0, maxLength));\n  }\n  return value;\n}\n'''
          new = r'''function representativeCharacterFromClass(source) {
  if (!source || source.startsWith('^')) {
    return undefined;
  }
  if (source.startsWith('\\d')) {
    return '0';
  }
  if (source.startsWith('\\w')) {
    return 'a';
  }
  if (source.startsWith('\\s')) {
    return ' ';
  }
  if (source.startsWith('\\') && source.length >= 2) {
    return source[1];
  }
  return source[0];
}

function buildAnchoredCharacterClassPattern(pattern, minLength, maxLength) {
  if (typeof pattern !== 'string' || !pattern.startsWith('^') || !pattern.endsWith('$')) {
    return undefined;
  }
  const body = pattern.slice(1, -1);
  const token = /\[((?:\\.|[^\]])+)\](\{(\d+)(?:,(\d*))?\}|[+*?])?/gyu;
  let index = 0;
  let value = '';
  let stretchable;

  while (index < body.length) {
    token.lastIndex = index;
    const match = token.exec(body);
    if (!match || match.index !== index) {
      return undefined;
    }
    const character = representativeCharacterFromClass(match[1]);
    if (character === undefined) {
      return undefined;
    }

    let minimum = 1;
    let maximum = 1;
    const quantifier = match[2];
    if (quantifier?.startsWith('{')) {
      minimum = Number(match[3]);
      maximum = match[4] === undefined
        ? minimum
        : match[4] === ''
          ? Number.POSITIVE_INFINITY
          : Number(match[4]);
    } else if (quantifier === '+') {
      minimum = 1;
      maximum = Number.POSITIVE_INFINITY;
    } else if (quantifier === '*') {
      minimum = 0;
      maximum = Number.POSITIVE_INFINITY;
    } else if (quantifier === '?') {
      minimum = 0;
      maximum = 1;
    }

    value += character.repeat(minimum);
    if (maximum > minimum) {
      stretchable = {
        character,
        remaining: Number.isFinite(maximum) ? maximum - minimum : Number.POSITIVE_INFINITY,
      };
    }
    index = token.lastIndex;
  }

  if (value.length < minLength) {
    const additional = minLength - value.length;
    if (!stretchable || additional > stretchable.remaining) {
      return undefined;
    }
    value += stretchable.character.repeat(additional);
  }
  if (value.length > maxLength) {
    return undefined;
  }
  return value;
}

function buildString(schema) {
  const minLength = typeof schema.minLength === 'number' ? schema.minLength : 0;
  const maxLength = typeof schema.maxLength === 'number' ? schema.maxLength : Number.POSITIVE_INFINITY;
  const patterned = buildAnchoredCharacterClassPattern(schema.pattern, minLength, maxLength);
  if (patterned !== undefined) {
    return patterned;
  }
  const seed = 'tsjsv';
  let value = seed.length >= minLength ? seed : seed.padEnd(minLength, 'x');
  if (value.length > maxLength) {
    value = value.slice(0, Math.max(0, maxLength));
  }
  return value;
}
'''
          assert text.count(old) == 1, 'expected one buildString implementation'
          text = text.replace(old, new, 1)

          old_case = '''        case 'string':\n          if (typeof schemaNode.pattern === 'string') {\n            complete = false;\n          }\n          return buildString(schemaNode);\n'''
          new_case = '''        case 'string': {\n          const value = buildString(schemaNode);\n          if (typeof schemaNode.pattern === 'string') {\n            try {\n              if (!new RegExp(schemaNode.pattern, 'u').test(value)) {\n                complete = false;\n              }\n            } catch {\n              complete = false;\n            }\n          }\n          return value;\n        }\n'''
          assert text.count(old_case) == 1, 'expected one string synthesis case'
          path.write_text(text.replace(old_case, new_case, 1))
          PY

          cat > test/unit/witness-pattern-synthesis.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import test from 'node:test';
          import { SchemaResolver, validateInstance } from '../../src/instance-validator.mjs';
          import { synthesizeInstance } from '../../src/witness.mjs';

          const schema = {
            type: 'object',
            required: ['service', 'contractSha256'],
            properties: {
              service: {
                type: 'string',
                minLength: 1,
                maxLength: 128,
                pattern: '^[A-Za-z][A-Za-z0-9._-]*$',
              },
              contractSha256: {
                type: 'string',
                pattern: '^[0-9a-f]{64}$',
              },
            },
            unevaluatedProperties: false,
          };

          test('common anchored character-class patterns synthesize valid deterministic witnesses', () => {
            const resolver = new SchemaResolver();
            const record = resolver.addDocument(schema, 'pattern-witness.json');
            const synthesized = synthesizeInstance({
              schema,
              base: record.base,
              resolver,
              mode: 'full',
            });
            assert.equal(synthesized.complete, true);
            assert.match(synthesized.instance.service, /^[A-Za-z][A-Za-z0-9._-]*$/u);
            assert.match(synthesized.instance.contractSha256, /^[0-9a-f]{64}$/u);
            assert.equal(synthesized.instance.contractSha256, '0'.repeat(64));
            const verdict = validateInstance({
              schema,
              instance: synthesized.instance,
              resolver,
              base: record.base,
            });
            assert.equal(verdict.valid, true, JSON.stringify(verdict.errors));
          });
          EOF

          git diff --check -- src/witness.mjs test/unit/witness-pattern-synthesis.test.mjs

      - name: Run focused nested and full validator tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild @oresoftware/f2e --foreground-scripts
          node --test \
            ./test/unit/witness-pattern-synthesis.test.mjs \
            ./test/unit/differential-array-cardinality.test.mjs \
            ./test/unit/differential-nested-array-cardinality.test.mjs
          npm run check
          npm test

      - name: Remove one-shot repair lane and push reviewed result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          rm .github/workflows/repair-DEN-3828-pattern-witness-baseline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/witness.mjs test/unit/witness-pattern-synthesis.test.mjs .github/workflows/repair-DEN-3828-pattern-witness-baseline.yml
          git diff --cached --check
          git commit -m 'fix(DEN-3828): synthesize valid pattern baselines for differential probes'
          git -c credential.helper='!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f' \
            push https://github.com/ORESoftware/typespec-json-schema-validator.git \
            HEAD:fix/DEN-3828-array-cardinality-probes-20260911
