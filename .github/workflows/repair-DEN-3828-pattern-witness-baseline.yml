name: one-shot DEN-3828 pattern witness baseline

on:
  push:
    branches:
      - fix/DEN-3828-array-cardinality-probes-20260911
    paths:
      - '.github/workflows/repair-DEN-3828-pattern-witness-baseline.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Install Node 22.16.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.16.0'
          package-manager-cache: false

      - name: Apply pattern-valid witness baseline patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/patch-den-3828-pattern-baseline.py
          git diff --check -- src/witness.mjs test/unit/witness-pattern-synthesis.test.mjs

      - name: Run focused nested and full validator tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild @oresoftware/f2e --foreground-scripts
          node --test \
            ./test/unit/witness-pattern-synthesis.test.mjs \
            ./test/unit/differential-array-cardinality.test.mjs \
            ./test/unit/differential-nested-array-cardinality.test.mjs
          npm run check
          npm test

      - name: Remove temporary repair files and push reviewed result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          rm .github/workflows/repair-DEN-3828-pattern-witness-baseline.yml
          rm scripts/patch-den-3828-pattern-baseline.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/witness.mjs test/unit/witness-pattern-synthesis.test.mjs .github/workflows/repair-DEN-3828-pattern-witness-baseline.yml scripts/patch-den-3828-pattern-baseline.py
          git diff --cached --check
          git commit -m 'fix(DEN-3828): synthesize valid pattern baselines for differential probes'
          git -c credential.helper='!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f' \
            push https://github.com/ORESoftware/typespec-json-schema-validator.git \
            HEAD:fix/DEN-3828-array-cardinality-probes-20260911
