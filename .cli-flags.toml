[help]
url = "https://github.com/ORESoftware/typespec-json-schema-validator#usage"
columns = ["options", "env", "type", "default", "description"]

[env]
files = []

[parse]
command_env = "TSJSV_COMMAND"
positionals_env = "TSJSV_POSITIONALS"
unknown_options_env = "TSJSV_UNKNOWN_OPTIONS"
errors_env = "TSJSV_PARSE_ERRORS"
allow_unknown = false

[flags.report]
env = "TSJSV_REPORT"
aliases = ["report"]
short = "r"
type = "string"
default = ".typespec-json-schema-validator/report.json"
help = "Machine-readable parity report path."

[flags.sarif]
env = "TSJSV_SARIF"
aliases = ["sarif"]
type = "string"
help = "Optional deterministic SARIF 2.1.0 presentation artifact path."

[flags.mapping]
env = "TSJSV_MAPPING"
aliases = ["mapping"]
short = "m"
type = "string"
help = "Optional declaration mapping JSON file."

[flags.max-findings]
env = "TSJSV_MAX_FINDINGS"
aliases = ["max-findings"]
type = "integer"
default = 250
help = "Maximum number of findings emitted into the report."

[flags.instances]
env = "TSJSV_INSTANCES"
aliases = ["instances"]
short = "i"
type = "string"
help = "Directory of JSON instances validated against both authorities (<Declaration>/{valid,invalid}/*.json)."

[flags.probes]
env = "TSJSV_PROBES"
aliases = ["probes"]
type = "bool"
default = "true"
help = "Run the differential instance-validation lane; disabling it removes behavioral evidence."

[flags.max-probes]
env = "TSJSV_MAX_PROBES"
aliases = ["max-probes"]
type = "integer"
default = 64
help = "Synthesized probes per declaration per lane in the differential lane."

[flags.format-assertion]
env = "TSJSV_FORMAT_ASSERTION"
aliases = ["format-assertion"]
type = "bool"
default = "false"
help = "Treat known JSON Schema format values as assertions in both lanes rather than annotations."

[flags.tsp-bin]
env = "TSJSV_TSP_BIN"
aliases = ["tsp-bin"]
type = "string"
help = "Explicit TypeSpec compiler executable."

[flags.quiet]
env = "TSJSV_QUIET"
aliases = ["quiet"]
short = "q"
type = "bool"
default = "false"
help = "Suppress the human-readable summary; the JSON report is still written."

[commands.check]
help = "Compile TypeSpec to comparison-only JSON Schema, then compare it with the independently authored JSON Schema."
env = "TSJSV_COMMAND_CHECK"

[commands.check.flags.typespec]
env = "TSJSV_TYPESPEC"
aliases = ["typespec"]
short = "t"
type = "string"
help = "TypeSpec entry file or project directory."

[commands.check.flags.schema]
env = "TSJSV_AUTHORED_SCHEMA"
aliases = ["schema", "authored-schema"]
short = "s"
type = "string"
help = "Independently authored JSON Schema file or directory."

[commands.check.flags.output-dir]
env = "TSJSV_OUTPUT_DIR"
aliases = ["output-dir"]
short = "o"
type = "string"
default = ".typespec-json-schema-validator/generated"
help = "Dedicated directory for TypeSpec-generated comparison evidence."

[commands.check.flags.bundle-id]
env = "TSJSV_BUNDLE_ID"
aliases = ["bundle-id"]
type = "string"
default = "typespec.generated.schema.json"
help = "Filename and $id used by the official TypeSpec JSON Schema bundle emitter."

[commands.check.flags.int64-strategy]
env = "TSJSV_INT64_STRATEGY"
aliases = ["int64-strategy"]
type = "string"
default = "string"
help = "Official TypeSpec JSON Schema emitter int64 strategy: string or number."

[commands.check.flags.seal-object-schemas]
env = "TSJSV_SEAL_OBJECT_SCHEMAS"
aliases = ["seal-object-schemas"]
type = "bool"
default = "true"
help = "Seal emitted object schemas with the official emitter."

[commands.check.flags.polymorphic-models-strategy]
env = "TSJSV_POLYMORPHIC_MODELS_STRATEGY"
aliases = ["polymorphic-models-strategy"]
type = "string"
default = "oneOf"
help = "Official emitter discriminator strategy: ignore, oneOf, or anyOf."

[commands.check.flags.contract-ir]
env = "TSJSV_CONTRACT_IR"
aliases = ["contract-ir", "emit-ir"]
type = "string"
help = "Optional path for a digest-bound parity-approved Contract IR, or a non-admissible tombstone on failure."

[commands.compare]
help = "Compare a pre-generated TypeSpec JSON Schema witness with the authored JSON Schema and source inventory."
env = "TSJSV_COMMAND_COMPARE"

[commands.compare.flags.typespec]
env = "TSJSV_TYPESPEC"
aliases = ["typespec"]
short = "t"
type = "string"
help = "TypeSpec entry file or project directory."

[commands.compare.flags.schema]
env = "TSJSV_AUTHORED_SCHEMA"
aliases = ["schema", "authored-schema"]
short = "s"
type = "string"
help = "Independently authored JSON Schema file or directory."

[commands.compare.flags.generated-schema]
env = "TSJSV_GENERATED_SCHEMA"
aliases = ["generated-schema"]
short = "g"
type = "string"
help = "JSON Schema previously generated from TypeSpec."

[commands.compare.flags.contract-ir]
env = "TSJSV_CONTRACT_IR"
aliases = ["contract-ir", "emit-ir"]
type = "string"
help = "Optional path for a digest-bound parity-approved Contract IR, or a non-admissible tombstone on failure."

[commands.validate]
help = "Run only the differential lane: execute both authorities as validators over one instance corpus."
env = "TSJSV_COMMAND_VALIDATE"

[commands.validate.flags.schema]
env = "TSJSV_AUTHORED_SCHEMA"
aliases = ["schema", "authored-schema"]
short = "s"
type = "string"
help = "Independently authored JSON Schema file or directory."

[commands.validate.flags.generated-schema]
env = "TSJSV_GENERATED_SCHEMA"
aliases = ["generated-schema"]
short = "g"
type = "string"
help = "JSON Schema previously generated from TypeSpec."

[commands.inventory]
help = "Print the independently scanned TypeSpec declaration inventory."
env = "TSJSV_COMMAND_INVENTORY"

[commands.inventory.flags.typespec]
env = "TSJSV_TYPESPEC"
aliases = ["typespec"]
short = "t"
type = "string"
help = "TypeSpec entry file or project directory."

[commands.generate]
help = "Generate a comparison-only JSON Schema witness from TypeSpec without comparing it."
env = "TSJSV_COMMAND_GENERATE"

[commands.generate.flags.typespec]
env = "TSJSV_TYPESPEC"
aliases = ["typespec"]
short = "t"
type = "string"
help = "TypeSpec entry file or project directory."

[commands.generate.flags.output-dir]
env = "TSJSV_OUTPUT_DIR"
aliases = ["output-dir"]
short = "o"
type = "string"
default = ".typespec-json-schema-validator/generated"
help = "Dedicated directory for generated comparison evidence."

[commands.generate.flags.bundle-id]
env = "TSJSV_BUNDLE_ID"
aliases = ["bundle-id"]
type = "string"
default = "typespec.generated.schema.json"
help = "Filename and $id used by the official TypeSpec JSON Schema bundle emitter."

[commands.generate.flags.int64-strategy]
env = "TSJSV_INT64_STRATEGY"
aliases = ["int64-strategy"]
type = "string"
default = "string"
help = "Official TypeSpec JSON Schema emitter int64 strategy: string or number."

[commands.generate.flags.seal-object-schemas]
env = "TSJSV_SEAL_OBJECT_SCHEMAS"
aliases = ["seal-object-schemas"]
type = "bool"
default = "true"
help = "Seal emitted object schemas with the official emitter."

[commands.generate.flags.polymorphic-models-strategy]
env = "TSJSV_POLYMORPHIC_MODELS_STRATEGY"
aliases = ["polymorphic-models-strategy"]
type = "string"
default = "oneOf"
help = "Official emitter discriminator strategy: ignore, oneOf, or anyOf."

[commands.verify-ir]
help = "Verify an existing Contract IR against its parity receipt and the exact current TypeSpec/generated/authored input closure."
env = "TSJSV_COMMAND_VERIFY_IR"

[commands.verify-ir.flags.contract-ir]
env = "TSJSV_CONTRACT_IR"
aliases = ["contract-ir"]
type = "string"
help = "Existing parity-approved Contract IR to verify. This command never overwrites the input."

[commands.verify-ir.flags.parity-receipt]
env = "TSJSV_PARITY_RECEIPT"
aliases = ["parity-receipt", "receipt"]
type = "string"
help = "Passed parity receipt that the Contract IR claims to consume."

[commands.verify-ir.flags.typespec]
env = "TSJSV_TYPESPEC"
aliases = ["typespec"]
short = "t"
type = "string"
help = "Current independently authored TypeSpec entry file or project directory."

[commands.verify-ir.flags.schema]
env = "TSJSV_AUTHORED_SCHEMA"
aliases = ["schema", "authored-schema"]
short = "s"
type = "string"
help = "Current independently authored JSON Schema file or directory."

[commands.verify-ir.flags.generated-schema]
env = "TSJSV_GENERATED_SCHEMA"
aliases = ["generated-schema"]
short = "g"
type = "string"
help = "Current TypeSpec-generated comparison-only JSON Schema witness."

[commands.verify-ir.flags.verification]
env = "TSJSV_VERIFICATION"
aliases = ["verification"]
type = "string"
default = ".typespec-json-schema-validator/contract-ir-verification.json"
help = "Deterministic consumer-verification artifact path."

[commands.doctor]
help = "Check the flags-2-env and TypeSpec toolchain required by the validator."
env = "TSJSV_COMMAND_DOCTOR"
