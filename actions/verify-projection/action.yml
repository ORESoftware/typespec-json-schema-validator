name: Verify downstream projection admission
description: Reverify current peer-authority inputs, trusted projection policy, exact manifest inputs, and generated output bytes.
author: ORESoftware

inputs:
  root:
    description: Checked-out workspace root containing every relative input and output path.
    required: false
    default: .
  projection_manifest:
    description: Existing self-digesting downstream projection manifest, relative to root.
    required: true
  contract_ir:
    description: Existing parity-approved Contract IR, relative to root.
    required: true
  parity_receipt:
    description: Passed parity receipt consumed by the Contract IR and manifest, relative to root.
    required: true
  typespec:
    description: Current independently authored TypeSpec entry file or project directory, relative to root.
    required: true
  generated_schema:
    description: Current TypeSpec-generated comparison-only JSON Schema B, relative to root.
    required: true
  authored_schema:
    description: Current independently authored JSON Schema A file or directory, relative to root.
    required: true
  policy:
    description: Trusted projection verification policy, relative to root.
    required: true
  verification:
    description: Relative path for the deterministic self-digesting projection verification receipt.
    required: false
    default: .typespec-json-schema-validator/projection-verification.json
  quiet:
    description: Suppress the human-readable receipt while retaining the machine-readable artifact.
    required: false
    default: "true"

outputs:
  verification:
    description: Projection verification receipt path.
    value: ${{ steps.verify.outputs.verification }}
  status:
    description: Projection verification receipt status.
    value: ${{ steps.verify.outputs.status }}

runs:
  using: composite
  steps:
    - name: Install the validator's lockfile-pinned toolchain
      shell: bash
      run: |
        set -euo pipefail
        cd "${GITHUB_ACTION_PATH}/../.."
        npm ci --omit=dev

    - name: Verify current source closure and projection evidence
      id: verify
      shell: bash
      env:
        TSJSV_PROJECTION_ROOT: ${{ inputs.root }}
        TSJSV_PROJECTION_MANIFEST: ${{ inputs.projection_manifest }}
        TSJSV_CONTRACT_IR: ${{ inputs.contract_ir }}
        TSJSV_PARITY_RECEIPT: ${{ inputs.parity_receipt }}
        TSJSV_TYPESPEC: ${{ inputs.typespec }}
        TSJSV_GENERATED_SCHEMA: ${{ inputs.generated_schema }}
        TSJSV_AUTHORED_SCHEMA: ${{ inputs.authored_schema }}
        TSJSV_PROJECTION_POLICY: ${{ inputs.policy }}
        TSJSV_PROJECTION_VERIFICATION: ${{ inputs.verification }}
        TSJSV_QUIET: ${{ inputs.quiet }}
      run: |
        set -euo pipefail
        node "${GITHUB_ACTION_PATH}/../../bin/typespec-json-schema-validator.mjs" verify-projection
        receipt_path="${TSJSV_PROJECTION_ROOT%/}/${TSJSV_PROJECTION_VERIFICATION}"
        test -s "${receipt_path}"
        status="$(node -e '
          const fs = require("node:fs");
          const receipt = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
          if (receipt.status !== "passed" || receipt.admissible !== true) {
            throw new Error("projection verification receipt is not admissible");
          }
          process.stdout.write(receipt.status);
        ' "${receipt_path}")"
        printf 'verification=%s\n' "${receipt_path}" >> "${GITHUB_OUTPUT}"
        printf 'status=%s\n' "${status}" >> "${GITHUB_OUTPUT}"
