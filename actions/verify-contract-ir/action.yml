name: Verify parity-approved Contract IR for a downstream consumer
description: Rebuild and verify retained Contract IR against explicit current source paths and the complete expected declaration inventory, then publish a self-digesting receipt.
inputs:
  contract_ir:
    description: Retained Contract IR file in the checked-out workspace.
    required: true
  report:
    description: Retained parity receipt file in the checked-out workspace.
    required: true
  typespec:
    description: Explicit current TypeSpec entry file or project directory; never taken from the receipt.
    required: true
  schema:
    description: Explicit current independently authored JSON Schema file or directory.
    required: true
  generated_schema:
    description: Explicit current generated JSON Schema comparison witness file or directory.
    required: true
  expected_declarations:
    description: JSON array of every qualified TypeSpec declaration ID this consumer expects. Empty or partial scopes fail.
    required: true
  verification:
    description: Workspace-relative path for the deterministic consumer verification receipt.
    required: false
    default: .typespec-json-schema-validator/consumer-verification.json
outputs:
  verification:
    description: Consumer verification receipt path.
    value: ${{ inputs.verification }}
runs:
  using: composite
  steps:
    - name: Install the immutable verifier's lockfile-pinned toolchain
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: npm ci --omit=dev
    - name: Verify receipt, current inputs, IR digest, and complete consumer scope
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        TSJSV_VERIFY_IR: ${{ inputs.contract_ir }}
        TSJSV_VERIFY_REPORT: ${{ inputs.report }}
        TSJSV_VERIFY_TYPESPEC: ${{ inputs.typespec }}
        TSJSV_VERIFY_AUTHORED: ${{ inputs.schema }}
        TSJSV_VERIFY_GENERATED: ${{ inputs.generated_schema }}
        TSJSV_VERIFY_DECLARATIONS: ${{ inputs.expected_declarations }}
        TSJSV_VERIFY_VERIFICATION: ${{ inputs.verification }}
      run: node "${GITHUB_ACTION_PATH}/../../scripts/verify-consumer.mjs"
