name: Verify Dafny formal contracts
description: Bind TypeSpec operations to independently authored behavioral contracts and immutable Dafny proof sources, then publish deterministic proof evidence.
inputs:
  typespec:
    description: Current independently authored TypeSpec entry file.
    required: true
  behavior_contract:
    description: Independently authored behavior-contract/v1 JSON file.
    required: true
  formal_manifest:
    description: Independently authored formal-manifest/v1 JSON file.
    required: true
  dafny_bin:
    description: Dafny executable already installed on the runner.
    required: false
    default: dafny
  verification:
    description: Workspace-relative path for the deterministic formal verification receipt.
    required: false
    default: .typespec-json-schema-validator/formal-verification.json
outputs:
  verification:
    description: Formal verification receipt path.
    value: ${{ inputs.verification }}
runs:
  using: composite
  steps:
    - name: Install the immutable verifier's lockfile-pinned toolchain
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: npm ci --omit=dev
    - name: Verify TypeSpec bindings and Dafny proof sources
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        TSJSV_FORMAL_TYPESPEC: ${{ inputs.typespec }}
        TSJSV_FORMAL_BEHAVIOR: ${{ inputs.behavior_contract }}
        TSJSV_FORMAL_MANIFEST: ${{ inputs.formal_manifest }}
        TSJSV_FORMAL_DAFNY_BIN: ${{ inputs.dafny_bin }}
        TSJSV_FORMAL_VERIFICATION: ${{ inputs.verification }}
      run: node "${GITHUB_ACTION_PATH}/../../scripts/verify-formal.mjs"
