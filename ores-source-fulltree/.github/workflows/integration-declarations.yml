name: Integration declaration integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-declarations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  declaration-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify declaration-only manifest (not a runtime parity claim)
        run: python3 scripts/verify_integration_manifest.py
      - name: Run fail-closed manifest gate adversarial regression suite
        run: python3 -m unittest discover -s tests -p 'test_integration_manifest.py' -v
